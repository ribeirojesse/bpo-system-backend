
name: bpo-system

services:

  api:
    build: .
    container_name: bpo_api
    # Só acessível da própria máquina (127.0.0.1): este compose é de
    # desenvolvimento e não deve ficar exposto na rede local/pública.
    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - .:/app

    depends_on:
      - postgres

    env_file:
      - .env

  postgres:
    image: postgres:16

    container_name: bpo_postgres

    restart: always

    environment:
      POSTGRES_DB: bpo_db
      POSTGRES_USER: postgres
      # Sobrescreva com POSTGRES_PASSWORD no ambiente/.env do compose para
      # não usar a senha padrão. (Só vale na criação do volume; para um
      # volume já existente a senha continua a de antes.)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4

    container_name: bpo_pgadmin

    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}

    ports:
      - "127.0.0.1:5050:80"

    depends_on:
      - postgres

volumes:
  postgres_data: